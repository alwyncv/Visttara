<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISTAARA 2026 – Admin</title><link rel="stylesheet" href="css/style.css">
<style>table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border:1px solid var(--line);padding:6px;text-align:left}.tw{overflow-x:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto;flex:1 1 150px}</style></head><body>
<header class="hero"><div class="wrap"><h1 style="font-size:2.2rem">VISTAARA 2026 – Admin</h1></div></header>
<main class="wrap"><div class="card" id="box"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script>
<script>
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let rows=[],email="";
function login(msg=""){$("#box").innerHTML=`<h2>Administrator sign-in</h2><p>${msg}</p><div class="f"><label for="e">Admin email</label><input id="e" type="email"></div><button onclick="sendC()">Send code</button><div class="f" style="margin-top:12px"><label for="c">Code</label><input id="c" inputmode="numeric"></div><button onclick="ver()">Sign in</button>`}
async function sendC(){email=$("#e").value.trim().toLowerCase();const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});login(error?"Could not send code (is this an admin email?).":"Code sent.")}
async function ver(){const{error}=await sb.auth.verifyOtp({email,token:$("#c").value.trim(),type:"email"});error?login("Invalid code."):load()}
async function load(){const{data:a}=await sb.rpc("is_admin");if(!a){await sb.auth.signOut();return login("This account is not an administrator.")}
 const{data,error}=await sb.from("registrations").select("*,participants(*)").order("created_at",{ascending:false});if(error)return login("Could not load data.");rows=data;view()}
function view(){$("#box").innerHTML=`<div class="bar"><input id="q" placeholder="Search team, ID or email" oninput="draw()"><select id="th" onchange="draw()"><option value="">All themes</option><option value="1">Theme 1</option><option value="2">Theme 2</option><option value="3">Theme 3</option></select><select id="jc" onchange="draw()"><option value="">JEC + External</option><option value="In-house">In-house</option><option value="External">External</option></select><select id="ps" onchange="draw()"><option value="">All payments</option><option>Pending</option><option>Verified</option><option>Rejected</option></select><button onclick="csv()">Export Excel (CSV)</button><button class="alt" onclick="sb.auth.signOut().then(()=>login())">Sign out</button></div><p id="cnt"></p><div class="tw"><table><thead><tr><th>ID</th><th>Team</th><th>Email</th><th>Theme</th><th>Category</th><th>Fee</th><th>Txn</th><th>Status</th><th>Proof</th><th>Details</th></tr></thead><tbody id="tb"></tbody></table></div>`;draw()}
const flt=()=>{const q=$("#q").value.toLowerCase(),t=$("#th").value,j=$("#jc").value,p=$("#ps").value;return rows.filter(r=>(!q||[r.team_name,r.registration_id,r.email].some(x=>x.toLowerCase().includes(q)))&&(!t||r.theme==t)&&(!j||r.registration_category===j)&&(!p||r.payment_status===p))};
function draw(){const f=flt();$("#cnt").textContent=f.length+" registration(s)";$("#tb").innerHTML=f.map(r=>`<tr><td>${esc(r.registration_id)}</td><td>${esc(r.team_name)}</td><td>${esc(r.email)}</td><td>${r.theme}</td><td>${esc(r.registration_category)}</td><td>${r.registration_fee}</td><td>${esc(r.transaction_id)}</td><td><select aria-label="Payment status" onchange="st('${esc(r.registration_id)}',this.value)">${["Pending","Verified","Rejected"].map(s=>`<option ${s===r.payment_status?"selected":""}>${s}</option>`).join("")}</select></td><td><button onclick="pf('${esc(r.payment_proof_path)}')">Open</button></td><td><button class="alt" onclick="det('${esc(r.registration_id)}')">View</button></td></tr>`).join("")}
async function st(id,v){await sb.from("registrations").update({payment_status:v,updated_at:new Date().toISOString()}).eq("registration_id",id);rows.find(r=>r.registration_id===id).payment_status=v}
async function pf(p){const{data}=await sb.storage.from("payment-proofs").createSignedUrl(p,120);data&&open(data.signedUrl,"_blank","noopener")}
function det(id){const r=rows.find(x=>x.registration_id===id);alert(r.registration_id+"\nTeam: "+r.team_name+"\nLeader: "+r.leader+"\nInstitution: "+(r.institution||"JEC")+", "+(r.state||"")+"\nMentor: "+(r.mentor_available?Object.values(r.mentor).join(", "):"No")+"\n\n"+r.participants.sort((a,b)=>a.participant_number-b.participant_number).map(p=>p.participant_number+". "+p.name+" | "+p.category+" | "+p.phone+" | JEC: "+(p.is_jec?[p.university_reg_no,p.department,p.year].join(", "):"No")).join("\n"))}
function csv(){const H=["Registration ID","Registration Date","Verified Email","Team Name","Number of Members","Team Leader","Theme","Mentor Available","Mentor Name","Mentor Designation","Mentor Institution","Mentor Address","Institution","State","JEC Team","Registration Category","Registration Fee","Payment Date","Transaction ID","Payment Status","Payment Proof"];
 for(let i=1;i<=4;i++)H.push(...["Name","Category","Phone","JEC Status","University Reg No","Department","Year"].map(h=>`Participant ${i} ${h}`));
 const L=flt().map(r=>{const m=r.mentor||{},o=[r.registration_id,r.created_at,r.email,r.team_name,r.member_count,r.leader,r.theme,r.mentor_available?"Yes":"No",m.name,m.desig,m.org,m.addr,r.institution,r.state,r.is_jec_team?"Yes":"No",r.registration_category,r.registration_fee,r.payment_date,r.transaction_id,r.payment_status,r.payment_proof_path];
  for(let i=1;i<=4;i++){const p=r.participants.find(x=>x.participant_number===i)||{};o.push(p.name,p.category,p.phone,p.name?(p.is_jec?"Yes":"No"):"",p.university_reg_no,p.department,p.year)}return o});
 const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const b=new Blob(["\ufeff"+[H,...L].map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="vistaara-2026-registrations.csv";a.click()}
sb.auth.getSession().then(({data})=>data.session?load():login());
</script></body></html>
